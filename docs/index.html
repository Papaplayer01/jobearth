<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoBearth: fresher and internship jobs across India</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--deep:#06242b;--sea:#0b3a42;--moss:#8fd98b;--sand:#f3ead3;--mist:#a9c3bd;--sun:#ffc857;--line:#ffffff1f;
--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;background:var(--deep);color:var(--sand);min-height:100vh;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:8px}
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2rem;max-width:1200px;margin:auto;padding:4.5rem 1.5rem 2rem;min-height:78vh}
.hero h1{font-size:clamp(3rem,8vw,6.5rem);line-height:.92;font-weight:800;letter-spacing:-.04em}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(60%) rotate(4deg);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i)*55ms)}
@keyframes rise{to{opacity:1;transform:none}}
.hero p{max-width:34ch;margin-top:1.4rem;color:var(--mist);font-size:1.15rem}
.stats{margin-top:1.6rem;display:flex;gap:2rem;color:var(--mist)}
.stats b{display:block;font-size:2rem;color:var(--sand);font-variant-numeric:tabular-nums}
#globe{width:100%;aspect-ratio:1;max-width:520px;justify-self:center;cursor:grab}
.bar{position:sticky;top:0;z-index:5;backdrop-filter:blur(16px) saturate(1.4);background:#06242bcc;border-block:1px solid var(--line)}
.bar>div{max-width:1200px;margin:auto;padding:.9rem 1.5rem;display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.search{flex:1 1 260px;position:relative}
input,select{font:inherit;color:var(--sand);background:var(--sea);border:1px solid var(--line);border-radius:999px;padding:.7rem 1.1rem;width:100%;transition:border-color .3s,box-shadow .3s,background .3s}
input:focus,select:focus{border-color:var(--moss);box-shadow:0 0 0 4px #8fd98b26;outline:0}
select{width:auto;appearance:none;padding-right:1.1rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;width:100%}
.chip{font:inherit;color:var(--mist);background:transparent;border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;cursor:pointer;transition:background .35s var(--ease),color .35s,border-color .35s,transform .35s var(--ease)}
.chip:hover{transform:translateY(-2px);border-color:var(--mist)}
.chip[aria-pressed=true]{background:var(--moss);color:var(--deep);border-color:var(--moss)}
main{max-width:1200px;margin:auto;padding:1.5rem 1.5rem 5rem}
#meta{color:var(--mist);margin-bottom:1rem;min-height:1.5em}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1rem}
.card{position:relative;text-align:left;font:inherit;color:inherit;background:linear-gradient(160deg,#0f4650,#0a2f37);border:1px solid var(--line);border-radius:22px;padding:1.3rem;cursor:pointer;display:flex;flex-direction:column;gap:.5rem;overflow:hidden;transition:transform .5s var(--ease),border-color .4s;--mx:50%;--my:0%}
.card::before{pointer-events:none;content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),#8fd98b24,transparent 70%);opacity:0;transition:opacity .4s}
.card:hover{transform:translateY(-5px);border-color:#8fd98b66}.card:hover::before{opacity:1}
.card h3{font-size:1.2rem;line-height:1.2;font-weight:650;position:relative}
.card .co{color:var(--mist);position:relative}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto;padding-top:.6rem;position:relative}
.tag{font-size:.82rem;padding:.2rem .65rem;border-radius:999px;background:#ffffff14}
.tag.role{background:var(--sun);color:#3a2a00;font-weight:600}
.apply{margin-left:auto;font-weight:700;color:var(--deep);background:var(--moss);border-radius:999px;padding:.2rem .8rem;text-decoration:none;font-size:.85rem;transition:transform .3s var(--ease)}.apply:hover{transform:translateY(-2px)}
.acts{display:flex;gap:.5rem;align-items:center;position:relative;padding-top:.7rem}.acts .apply{margin-left:auto}
.act{font:inherit;font-size:.85rem;color:var(--sand);background:#ffffff14;border:1px solid var(--line);border-radius:999px;padding:.2rem .8rem;cursor:pointer;transition:background .3s,transform .3s var(--ease)}.act:hover{background:#ffffff26;transform:translateY(-2px)}
.tag.new{background:var(--moss);color:var(--deep);font-weight:600}.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.empty{grid-column:1/-1;padding:4rem 1rem;text-align:center;color:var(--mist)}
#drawer{position:fixed;inset:0;z-index:20;pointer-events:none}
#drawer .veil{position:absolute;inset:0;background:#02131880;backdrop-filter:blur(0);opacity:0;transition:opacity .5s var(--ease),backdrop-filter .5s}
#drawer .sheet{position:absolute;right:0;top:0;height:100%;width:min(520px,100%);background:var(--sea);border-left:1px solid var(--line);padding:2rem;overflow:auto;transform:translateX(104%);transition:transform .65s var(--ease)}
#drawer.open{pointer-events:auto}.open .veil{opacity:1;backdrop-filter:blur(6px)}.open .sheet{transform:none}
.sheet h2{font-size:2rem;line-height:1.05;letter-spacing:-.02em;margin:1rem 0 .4rem}
.sheet p{color:var(--mist);margin:1rem 0;max-width:60ch}
.btn{display:inline-block;background:var(--moss);color:var(--deep);font-weight:700;border:0;border-radius:999px;padding:.8rem 1.5rem;text-decoration:none;cursor:pointer;font:inherit;font-weight:700;transition:transform .35s var(--ease),box-shadow .35s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px #8fd98b40}
.btn.ghost{background:transparent;color:var(--sand);border:1px solid var(--line)}
footer{text-align:center;color:var(--mist);padding:2rem;border-top:1px solid var(--line);font-size:.9rem}
::view-transition-group(*){animation-duration:.55s;animation-timing-function:var(--ease)}
::view-transition-old(*){animation-duration:.25s}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:3rem;min-height:0}#globe{max-width:340px;order:-1}}
@media(prefers-reduced-motion:reduce){*,::before{animation:none!important;transition-duration:.01ms!important}.hero h1 span{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero">
  <div>
    <h1 id="title" aria-label="JoBearth"></h1>
    <p>Fresher and internship posts from across India, collected from open job boards and refreshed every morning.</p>
    <div class="stats"><div><b id="n">0</b>open posts</div><div><b id="c">0</b>cities</div><div><b id="d">-</b>last refresh</div></div>
  </div>
  <canvas id="globe" aria-label="Globe showing cities with open posts" role="img"></canvas>
</header>

<div class="bar"><div>
  <div class="search"><input id="q" type="search" placeholder="Search title, company or skill" aria-label="Search jobs" autocomplete="off"></div>
  <select id="city" aria-label="City"></select>
  <select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="co">Company A to Z</option></select>
  <button class="chip" id="savedBtn" aria-pressed="false">★ Saved <span id="sc">0</span></button>
  <div class="chips" id="chips" role="group" aria-label="Role"></div>
</div></div>

<main><div id="meta" aria-live="polite"></div><div id="list"></div></main>

<div id="drawer" aria-hidden="true"><div class="veil"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-label="Job details"><div id="sheet"></div></aside></div>

<footer>Jobs by <a href="https://www.adzuna.in" target="_blank" rel="noopener">Adzuna</a>. JoBearth reads only public job boards and APIs that allow it. Always check the original post before applying.<br>Contact: <a href="mailto:jobearthh@gmail.com">jobearthh@gmail.com</a></footer>

<script>
const $=s=>document.querySelector(s), reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PINS={Bengaluru:[12.97,77.59],Mumbai:[19.07,72.88],Pune:[18.52,73.86],Hyderabad:[17.38,78.48],"Delhi NCR":[28.61,77.2],Chennai:[13.08,80.27],Kolkata:[22.57,88.36],Ahmedabad:[23.02,72.57],Nashik:[19.99,73.79]};
let JOBS=[],state={q:"",city:"All",role:"All",sort:"new",only:false};
const ls={get(k){try{return new Set(JSON.parse(localStorage.getItem(k)||"[]"))}catch(e){return new Set()}},put(k,v){try{localStorage.setItem(k,JSON.stringify([...v]))}catch(e){}}};
let saved=ls.get("jb_saved"),applied=ls.get("jb_applied");
const flip=(set,key,id)=>{set.has(id)?set.delete(id):set.add(id);ls.put(key,set);$("#sc").textContent=saved.size};
const isNew=j=>j.first_seen&&(Date.now()-new Date(j.first_seen))/864e5<2;

// headline: one staggered entrance
"JoBearth".split("").forEach((ch,i)=>{const s=document.createElement("span");s.textContent=ch;s.style.setProperty("--i",i);$("#title").append(s)});

const countUp=(el,to)=>{if(reduce){el.textContent=to;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1200);el.textContent=Math.round(to*(1-Math.pow(1-p,4)));if(p<1)requestAnimationFrame(f)})(t0)};

fetch("jobs.json").then(r=>r.json()).then(d=>{
  JOBS=d.jobs;const cities=[...new Set(JOBS.map(j=>j.city))].sort(),roles=[...new Set(JOBS.map(j=>j.role))].sort();
  $("#city").innerHTML=["All",...cities].map(c=>`<option value="${esc(c)}">${c=="All"?"All cities":esc(c)}</option>`).join("");
  $("#chips").innerHTML=["All",...roles].map(r=>`<button class="chip" aria-pressed="${r=="All"}" data-r="${esc(r)}">${esc(r)}</button>`).join("");
  countUp($("#n"),JOBS.length);countUp($("#c"),cities.filter(c=>c!="Other").length);
  $("#d").textContent=new Date(d.updated).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
  pins=cities.filter(c=>PINS[c]).map(c=>({c,p:PINS[c],n:JOBS.filter(j=>j.city==c).length}));
  render(false);if(d.sample)$("#meta").textContent="Showing sample posts. Run the collector to load real ones.";
}).catch(()=>{$("#list").innerHTML='<div class="empty">Could not load jobs.json. Serve this folder over http, for example with python -m http.server.</div>'});

function filtered(){const q=state.q.toLowerCase();
  let r=JOBS.filter(j=>(state.city=="All"||j.city==state.city)&&(state.role=="All"||j.role==state.role)&&(!state.only||saved.has(j.id))&&(!q||(j.title+j.company+j.description).toLowerCase().includes(q)));
  return r.sort(state.sort=="co"?(a,b)=>a.company.localeCompare(b.company):(a,b)=>(b.first_seen||"").localeCompare(a.first_seen||""))}

function draw(){const r=filtered();
  $("#list").innerHTML=r.length?r.map((j,i)=>`<div class="card" role="button" tabindex="0" data-id="${esc(j.id)}" ${i<24?`style="view-transition-name:c${i}"`:""}>
    <h3>${esc(j.title)}</h3><span class="co">${esc(j.company)} in ${esc(j.location_raw||j.city)}</span>
    <div class="tags"><span class="tag role">${esc(j.role)}</span><span class="tag">${esc(j.city)}</span><span class="tag">${esc(j.source)}</span>${isNew(j)?'<span class="tag new">New</span>':""}</div><div class="acts"><button class="act" data-a="save" aria-pressed="${saved.has(j.id)}">${saved.has(j.id)?"★ Saved":"☆ Save"}</button><button class="act" data-a="det">Details</button><a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">${applied.has(j.id)?"Applied ✓":"Apply"}</a></div></div>`).join(""):
    `<div class="empty">No posts match. Clear the search or pick another role.</div>`;
  if(!$("#meta").textContent.startsWith("Showing sample"))$("#meta").textContent=`${r.length} of ${JOBS.length} posts`}

function render(animate=true){(animate&&document.startViewTransition&&!reduce&&filtered().length<=60)?document.startViewTransition(draw):draw()}

$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#city").addEventListener("change",e=>{state.city=e.target.value;render()});
$("#savedBtn").addEventListener("click",e=>{state.only=!state.only;e.currentTarget.setAttribute("aria-pressed",state.only);render()});
$("#sc").textContent=saved.size;
$("#sort").addEventListener("change",e=>{state.sort=e.target.value;render()});
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;state.role=b.dataset.r;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render()});
$("#list").addEventListener("pointermove",e=>{const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")});

// detail drawer
let lastFocus;
function openJob(e){const ap=e.target.closest(".apply");if(ap){applied.has(ap.closest(".card").dataset.id)||flip(applied,"jb_applied",ap.closest(".card").dataset.id);ap.textContent="Applied ✓";return}
  const sv=e.target.closest("[data-a=save]");if(sv){const id=sv.closest(".card").dataset.id;flip(saved,"jb_saved",id);sv.textContent=saved.has(id)?"★ Saved":"☆ Save";return}
  const c=e.target.closest(".card");if(!c)return;const j=JOBS.find(x=>x.id==c.dataset.id);if(!j)return;lastFocus=c;try{
  $("#sheet").innerHTML=`<button class="btn ghost" id="x">Close</button><h2>${esc(j.title)}</h2><div class="co" style="color:var(--mist)">${esc(j.company)} in ${esc(j.location_raw||j.city)}</div>
  <div class="tags"><span class="tag role">${esc(j.role)}</span><span class="tag">${esc(j.city)}</span><span class="tag">Posted ${esc(j.posted||j.first_seen)}</span></div>
  <p>${esc(j.description.slice(0,700))}${j.description.length>700?"...":""}</p><div class="row"><button class="btn ghost" id="sv">${saved.has(j.id)?"★ Saved":"☆ Save"}</button><button class="btn ghost" id="ap">${applied.has(j.id)?"Applied ✓":"Mark applied"}</button><button class="btn ghost" id="cp">Copy link</button></div><a class="btn" id="go" href="${esc(j.url)}" target="_blank" rel="noopener">Apply on ${esc(j.source)}</a>`;
  $("#sv").onclick=()=>{flip(saved,"jb_saved",j.id);$("#sv").textContent=saved.has(j.id)?"★ Saved":"☆ Save";draw()};
  $("#ap").onclick=()=>{flip(applied,"jb_applied",j.id);$("#ap").textContent=applied.has(j.id)?"Applied ✓":"Mark applied";draw()};
  $("#go").onclick=()=>{applied.has(j.id)||flip(applied,"jb_applied",j.id);draw()};
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(j.url);$("#cp").textContent="Copied"}catch(err){$("#cp").textContent="Copy failed"}};
  $("#drawer").classList.add("open");$("#drawer").setAttribute("aria-hidden","false");$("#x").focus()}catch(err){console.error(err);window.open(j.url,"_blank","noopener")}}
$("#list").addEventListener("click",openJob);
$("#list").addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.matches(".card")){e.preventDefault();openJob(e)}});
const close=()=>{$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");lastFocus&&lastFocus.focus()};
$("#drawer").addEventListener("click",e=>{if(e.target.matches(".veil,#x"))close()});
addEventListener("keydown",e=>{if(e.key=="Escape")close()});

// globe: dotted sphere that sways over India, pins sized by post count
const cv=$("#globe"),ctx=cv.getContext("2d");let pins=[],px=0,py=0,W,t0=performance.now();
const DOTS=Array.from({length:1100},(_,i)=>{const y=1-2*(i+.5)/1100,lat=Math.asin(y),lon=i*2.39996;return[lat,lon%(2*Math.PI)]});
function size(){const d=devicePixelRatio||1;W=cv.clientWidth;cv.width=cv.height=W*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",size);size();
cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();px=(e.clientX-r.left)/r.width-.5;py=(e.clientY-r.top)/r.height-.5});
cv.addEventListener("pointerleave",()=>{px=py=0});
function proj(lat,lon,l0,p0,R){const dl=lon-l0,c=Math.cos(lat),vis=Math.sin(p0)*Math.sin(lat)+Math.cos(p0)*c*Math.cos(dl);
  return{x:R*c*Math.sin(dl),y:-R*(Math.cos(p0)*Math.sin(lat)-Math.sin(p0)*c*Math.cos(dl)),vis}}
let sx=0,sy=0;
(function frame(now){const t=(now-t0)/1000;sx+=(px-sx)*.05;sy+=(py-sy)*.05;
  const l0=(78+(reduce?0:34*Math.sin(t*.35)))*Math.PI/180+sx*.9,p0=(22*Math.PI/180)-sy*.6,R=W*.42;
  ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(W/2,W/2);
  const g=ctx.createRadialGradient(-R*.3,-R*.3,R*.1,0,0,R);g.addColorStop(0,"#124c57");g.addColorStop(1,"#082a31");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  for(const[a,b]of DOTS){const p=proj(a,b,l0,p0,R);if(p.vis>0){ctx.fillStyle=`rgba(169,195,189,${.12+.5*p.vis})`;ctx.fillRect(p.x,p.y,1.6,1.6)}}
  const mx=Math.max(1,...pins.map(p=>p.n));
  for(const pin of pins){const p=proj(pin.p[0]*Math.PI/180,pin.p[1]*Math.PI/180,l0,p0,R);if(p.vis<=0)continue;
    const r=4+8*pin.n/mx,pulse=reduce?0:(Math.sin(t*2+pin.n)+1)/2;
    ctx.strokeStyle=`rgba(255,200,87,${.5-.4*pulse})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,r+pulse*14,0,7);ctx.stroke();
    ctx.fillStyle="#ffc857";ctx.beginPath();ctx.arc(p.x,p.y,r*.55,0,7);ctx.fill();
    if(p.vis>.5){ctx.fillStyle="#f3ead3";ctx.font="600 12px Bricolage Grotesque,sans-serif";ctx.fillText(pin.c,p.x+r+4,p.y+4)}}
  ctx.restore();requestAnimationFrame(frame)})(t0);
</script>
</body>
</html>
